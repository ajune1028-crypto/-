# Publishes the app at a public address (GitHub Pages), so anyone can open it
# without Claude. On that address the browser allows the microphone, so the
# song room can record. With a room server named (docs/public-address.md) any
# browser joins a room by its link; without one, rooms stay on each device.
#
# One-time setup by the repository owner: Settings → Pages → Build and
# deployment → Source: "GitHub Actions"; Settings → Secrets and variables →
# Actions → Variables: HAMKKE_SERVER = the database address. Then every push
# to main publishes.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: One-file build
        # The room server (a Firebase Realtime Database address) comes from the repository
        # variable HAMKKE_SERVER; without it rooms stay on each device.
        env:
          HAMKKE_SERVER: ${{ vars.HAMKKE_SERVER }}
        run: node tools/bundle.mjs
      - name: Browser scenarios on the build
        run: node tools/e2e.mjs --dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

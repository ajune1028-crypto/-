<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>같이 쓰는 방 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&amp;display=swap">
<style>
/* Layout idea: a phone-width column. Soft, grainy colour fields lie at the back;
   the writing sheet stays bright and nearly solid so every colour reads; the
   chrome (bars, buttons, sheets that slide up) floats above as blue-tinted
   frosted glass. Colour belongs to the people writing. */

:root {
  /* surfaces */
  --paper: #f8fafd;
  /* The glass's colour: the chosen accent (blue unless chosen), for every tint below. */
  --tint: var(--accent);
  --base: color-mix(in srgb, var(--tint) 14%, #e6eaf0);
  --sheet: rgb(250 252 255 / 0.92);
  /* text. --muted is for solid surfaces, --soft for text lying straight on a colour field. */
  --ink: #1b2030;
  --muted-tone: #586174;
  --soft-tone: #394052;
  --muted: var(--muted-tone);
  --soft: var(--soft-tone);
  --line: rgb(46 78 140 / 0.16);
  --danger: #b3261e;
  /* blue */
  --accent: #2466dc;
  --accent-top: #3478ec;
  --accent-bottom: #1d5bd0;
  --accent-ink: #1d5bd0;
  --ring: #2466dc;
  --frame-a: color-mix(in srgb, var(--tint) 45%, #ffffff);
  --frame-b: color-mix(in srgb, var(--accent-2) 80%, #ffffff);
  /* A second hue for gradients, so the accent is not one flat blue. */
  --accent-2: #5b4fd6;
  --on-accent: #fff;
  --text-scale: 1;
  /* The main action of a sheet: deep, blue into violet. Other actions are quieter. */
  --btn-bg: linear-gradient(135deg, var(--accent-top) 0%, var(--accent-bottom) 62%, var(--accent-2) 130%);
  --btn-edge: rgb(255 255 255 / 0.26);
  --btn-shadow: inset 0 1px 0 rgb(255 255 255 / 0.45), 0 8px 20px color-mix(in srgb, var(--accent) 30%, transparent), 0 1px 2px rgb(20 50 120 / 0.3);
  --btn2-bg: var(--btn-bg);
  --btn2-edge: var(--btn-edge);
  --btn2-shadow: var(--btn-shadow);
  --btn2-ink: var(--on-accent);
  --switch-on: linear-gradient(180deg, var(--accent-top), var(--accent-bottom));
  /* colour fields: the corners take the glass colour (--sky); only the middle differs,
     orange for 일상 and periwinkle for 창작, the same in light and dark */
  --daily-b: #ffb27d;
  --creative-b: #b9c6ff;
  --sky: color-mix(in srgb, var(--tint) 38%, #ffffff);
  --field-strength: 0.85;
  /* glass */
  --glass-bg: linear-gradient(180deg, rgb(255 255 255 / 0.72) 0%, color-mix(in srgb, color-mix(in srgb, var(--tint) 24%, #ffffff) 50%, transparent) 100%);
  --glass-edge: rgb(255 255 255 / 0.85);
  --glass-shine: inset 0 1px 0 rgb(255 255 255 / 0.95), inset 0 -1px 0 rgb(255 255 255 / 0.35);
  --glass-shadow: 0 10px 28px color-mix(in srgb, var(--tint) 18%, transparent), 0 1px 3px rgb(38 72 140 / 0.12);
  --glass-blur: blur(20px) saturate(170%);
  --panel-bg: linear-gradient(180deg, rgb(248 251 255 / 0.9) 0%, color-mix(in srgb, color-mix(in srgb, var(--tint) 12%, #ffffff) 84%, transparent) 100%);
  /* Glass on coloured things (clips, cards): light from above and a bright top edge. */
  --gloss: linear-gradient(180deg, rgb(255 255 255 / 0.55) 0%, rgb(255 255 255 / 0) 55%);
  --gloss-edge: inset 0 1px 0 rgb(255 255 255 / 0.65);
  --card-bg: linear-gradient(180deg, rgb(255 255 255 / 0.66) 0%, color-mix(in srgb, color-mix(in srgb, var(--tint) 18%, #ffffff) 42%, transparent) 100%);
  --well: rgb(255 255 255 / 0.66);
  --split: -1px 0 0 0 rgb(255 255 255 / 0.6), -2px 0 0 0 rgb(46 78 140 / 0.1);
  --scrim: rgb(22 34 66 / 0.16);
  --grain-opacity: 0.55;
  --font: "Gothic A1", "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.9 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b0b0e;
    --base: #020204;
    --sheet: rgb(17 17 21 / 0.92);
    --ink: #f4f4f7;
    --muted-tone: #a3a3ae;
    --soft-tone: #e6e6ec;
    --line: rgb(255 255 255 / 0.1);
    --danger: #ff9188;
    --accent-ink: #a7c6ff;
    --ring: #8fb8ff;
    --frame-a: color-mix(in srgb, var(--tint) 55%, #000000);
    --frame-b: color-mix(in srgb, var(--accent-2) 55%, #000000);
    /* The middle keeps the light-mode colours; on near-black they glow at half strength so text on them reads (4.5:1). */
    --sky: color-mix(in srgb, var(--tint) 60%, #000000);
    --field-strength: 0.45;
    --glass-bg: linear-gradient(180deg, color-mix(in srgb, var(--tint) 16%, rgb(255 255 255 / 0.08)) 0%, rgb(255 255 255 / 0.035) 100%);
    --glass-edge: rgb(255 255 255 / 0.13);
    --glass-shine: inset 0 1px 0 rgb(255 255 255 / 0.16), inset 0 -1px 0 rgb(255 255 255 / 0.03);
    --glass-shadow: 0 14px 34px rgb(0 0 0 / 0.65), 0 1px 2px rgb(0 0 0 / 0.5);
    --glass-blur: blur(22px) saturate(140%);
    --panel-bg: linear-gradient(180deg, rgb(30 30 36 / 0.94) 0%, rgb(12 12 15 / 0.94) 100%);
    --card-bg: linear-gradient(180deg, rgb(22 22 28 / 0.62) 0%, rgb(10 10 14 / 0.74) 100%);
    --gloss: linear-gradient(180deg, rgb(255 255 255 / 0.09) 0%, rgb(255 255 255 / 0) 55%);
    --gloss-edge: inset 0 1px 0 rgb(255 255 255 / 0.12);
    --well: rgb(255 255 255 / 0.05);
    --split: -1px 0 0 0 rgb(255 255 255 / 0.08), -2px 0 0 0 rgb(0 0 0 / 0.4);
    --scrim: rgb(0 0 0 / 0.36);
    --grain-opacity: 0.5;
    /* Buttons are glass here. The one main action keeps a deep, glowing colour. */
    --btn-bg: linear-gradient(135deg, color-mix(in srgb, var(--accent-top) 92%, #fff 8%) 0%, var(--accent-bottom) 55%, var(--accent-2) 120%);
    --btn-edge: rgb(255 255 255 / 0.28);
    --btn-shadow: inset 0 1px 0 rgb(255 255 255 / 0.38), inset 0 0 0 1px rgb(255 255 255 / 0.06), 0 10px 30px color-mix(in srgb, var(--accent) 38%, transparent), 0 2px 6px rgb(0 0 0 / 0.5);
    --btn2-bg: linear-gradient(135deg, color-mix(in srgb, var(--accent) 36%, transparent) 0%, color-mix(in srgb, var(--accent-2) 24%, transparent) 100%);
    --btn2-edge: rgb(255 255 255 / 0.22);
    --btn2-shadow: inset 0 1px 0 rgb(255 255 255 / 0.24), 0 6px 18px rgb(0 0 0 / 0.45);
    --btn2-ink: #fff;
    --switch-on: linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, transparent), color-mix(in srgb, var(--accent-2) 70%, transparent));
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --paper: #0b0b0e;
  --base: #020204;
  --sheet: rgb(17 17 21 / 0.92);
  --ink: #f4f4f7;
  --muted-tone: #a3a3ae;
  --soft-tone: #e6e6ec;
  --line: rgb(255 255 255 / 0.1);
  --danger: #ff9188;
  --accent-ink: #a7c6ff;
  --ring: #8fb8ff;
  --frame-a: color-mix(in srgb, var(--tint) 55%, #000000);
  --frame-b: color-mix(in srgb, var(--accent-2) 55%, #000000);
  /* The middle keeps the light-mode colours; on near-black they glow at half strength so text on them reads (4.5:1). */
  --sky: color-mix(in srgb, var(--tint) 60%, #000000);
  --field-strength: 0.45;
  --glass-bg: linear-gradient(180deg, color-mix(in srgb, var(--tint) 16%, rgb(255 255 255 / 0.08)) 0%, rgb(255 255 255 / 0.035) 100%);
  --glass-edge: rgb(255 255 255 / 0.13);
  --glass-shine: inset 0 1px 0 rgb(255 255 255 / 0.16), inset 0 -1px 0 rgb(255 255 255 / 0.03);
  --glass-shadow: 0 14px 34px rgb(0 0 0 / 0.65), 0 1px 2px rgb(0 0 0 / 0.5);
  --glass-blur: blur(22px) saturate(140%);
  --panel-bg: linear-gradient(180deg, rgb(30 30 36 / 0.94) 0%, rgb(12 12 15 / 0.94) 100%);
  --card-bg: linear-gradient(180deg, rgb(22 22 28 / 0.62) 0%, rgb(10 10 14 / 0.74) 100%);
    --gloss: linear-gradient(180deg, rgb(255 255 255 / 0.09) 0%, rgb(255 255 255 / 0) 55%);
    --gloss-edge: inset 0 1px 0 rgb(255 255 255 / 0.12);
  --well: rgb(255 255 255 / 0.05);
  --split: -1px 0 0 0 rgb(255 255 255 / 0.08), -2px 0 0 0 rgb(0 0 0 / 0.4);
  --scrim: rgb(0 0 0 / 0.36);
  --grain-opacity: 0.5;
  /* Buttons are glass here. The one main action keeps a deep, glowing colour. */
  --btn-bg: linear-gradient(135deg, color-mix(in srgb, var(--accent-top) 92%, #fff 8%) 0%, var(--accent-bottom) 55%, var(--accent-2) 120%);
  --btn-edge: rgb(255 255 255 / 0.28);
  --btn-shadow: inset 0 1px 0 rgb(255 255 255 / 0.38), inset 0 0 0 1px rgb(255 255 255 / 0.06), 0 10px 30px color-mix(in srgb, var(--accent) 38%, transparent), 0 2px 6px rgb(0 0 0 / 0.5);
  --btn2-bg: linear-gradient(135deg, color-mix(in srgb, var(--accent) 36%, transparent) 0%, color-mix(in srgb, var(--accent-2) 24%, transparent) 100%);
  --btn2-edge: rgb(255 255 255 / 0.22);
  --btn2-shadow: inset 0 1px 0 rgb(255 255 255 / 0.24), 0 6px 18px rgb(0 0 0 / 0.45);
  --btn2-ink: #fff;
  --switch-on: linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, transparent), color-mix(in srgb, var(--accent-2) 70%, transparent));
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  height: 100%;
  font-size: calc(var(--k, 1) * 16px);
  -webkit-text-size-adjust: 100%;
  /* No blue flash where a finger lands; pressed things sink a little instead (below). */
  -webkit-tap-highlight-color: transparent;
}

body {
  height: 100%;
  margin: 0;
  background: var(--base);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

#app {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 22.5rem;
  height: 100%;
  margin: 0 auto;
  background: var(--paper);
  box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgb(20 40 90 / 0.18);
  overflow: hidden;
}
#app > * { flex: 1 1 auto; min-height: 0; }

/* ---- glass ---------------------------------------------------------------- */
/* Floating chrome: lets the colour behind it through, blurred, with a bright rim. */

.room > .bar, .toolbar, .pill, .add, .home-top .icon-btn {
  background: var(--glass-bg);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--glass-shine), var(--glass-shadow);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
}

/* Short messages: dark glass, so they read over anything. */
.toast, .banner, #app > .notice {
  background: color-mix(in srgb, var(--ink) 86%, transparent);
  color: var(--paper);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}

/* ---- colour fields with grain ------------------------------------------- */

.field {
  position: relative;
  isolation: isolate;
  background-color: var(--paper);
  /* Text lying straight on a field needs the stronger secondary tone. */
  --muted: var(--soft-tone);
}
.field::before, .field::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}
.field::after {
  background-image: var(--grain);
  background-size: 11.25rem 11.25rem;
  opacity: var(--grain-opacity);
  mix-blend-mode: soft-light;
}
.field.daily::before {
  background:
    radial-gradient(95% 44% at 16% 10%, var(--sky) 0%, transparent 72%),
    radial-gradient(115% 50% at 92% 56%, var(--daily-b) 0%, transparent 70%),
    radial-gradient(95% 40% at 6% 100%, var(--sky) 0%, transparent 72%);
  opacity: var(--field-strength);
}
.field.creative::before {
  background:
    radial-gradient(95% 44% at 86% 8%, var(--sky) 0%, transparent 72%),
    radial-gradient(115% 50% at 10% 54%, var(--creative-b) 0%, transparent 70%),
    radial-gradient(95% 40% at 96% 100%, var(--sky) 0%, transparent 72%);
  opacity: var(--field-strength);
}
/* Solid and nearly solid surfaces take the quieter secondary tone again. */
.paper, .panel { --muted: var(--muted-tone); }

/* ---- home ---------------------------------------------------------------- */

.home-wrap { position: relative; }
.home {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100%;
}
.half { position: relative; min-width: 0; height: 100%; }
.half-scroll {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 1.5rem 0.75rem 7.4rem;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.half + .half { box-shadow: var(--split); }
.half-title { padding: 0 0.25rem; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
.half-note { margin-top: 0.2rem; padding: 0 0.25rem; font-size: 0.75rem; color: var(--muted); }
.rooms { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1.4rem; }
.room-row {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  width: 100%;
  padding: 0.65rem 0.8rem 0.7rem;
  text-align: left;
  border: 1px solid var(--glass-edge);
  border-radius: 1.1rem;
  background: var(--card-bg);
  box-shadow: var(--glass-shine), 0 6px 16px rgb(38 72 140 / 0.1);
}
.room-name { font-size: 0.95rem; font-weight: 700; overflow-wrap: anywhere; }
/* Pressed: a small sink instead of the browser's blue flash. */
/* `scale` rather than `transform`, so it stacks on a transform the element already has (.add is centred by one). */
.room-row, .btn, label.btn, .icon-btn, .chip, .add, .swatch, .seg button { transition: scale 0.09s ease-out; }
.room-row:active, .btn:active, label.btn:active, .icon-btn:active, .chip:active, .add:active, .swatch:active, .seg button:active { scale: 0.96; }
@media (prefers-reduced-motion: reduce) {
  .room-row:active, .btn:active, label.btn:active, .icon-btn:active, .chip:active, .add:active, .swatch:active, .seg button:active { scale: none; opacity: 0.75; }
}
.room-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.45rem; margin-top: 0.15rem; }
.room-kind { display: inline-flex; align-items: center; gap: 0.2rem; padding: 0.08rem 0.45rem 0.08rem 0.3rem; border-radius: 999px; font-size: 0.68rem; font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--tint) 16%, transparent); }
.room-kind svg { width: 0.85rem; height: 0.85rem; flex: none; }
.room-when { font-size: 0.7rem; color: var(--muted); }
/* The people in a room, as overlapping colour dots (home: who is behind the door). */
.room-people { display: inline-flex; align-items: center; padding-left: 0.2rem; }
.room-people .dot { width: 0.62rem; height: 0.62rem; margin-left: -0.2rem; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--paper); }
.group-label { margin: 1.4rem 0 0.1rem; padding: 0 0.25rem; font-size: 0.7rem; color: var(--muted); }
.group-label + .rooms { margin-top: 0.4rem; }
.empty { margin-top: 1.4rem; padding: 0 0.25rem; font-size: 0.8rem; color: var(--muted); }

.add {
  position: absolute;
  left: 50%;
  bottom: 3.5rem;
  display: grid;
  place-items: center;
  width: 3.25rem;
  height: 3.25rem;
  border-radius: 50%;
  color: var(--accent-ink);
  transform: translateX(-50%);
}
.add svg { width: 1.35rem; height: 1.35rem; stroke-width: 2.2; }

.home-top { position: absolute; top: 1.25rem; right: 0.7rem; }
.home-foot {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0.9rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  pointer-events: none;
}
.home-foot > * { pointer-events: auto; }
.pill {
  padding: 0.4rem 0.9rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}
.hint { font-size: 0.7rem; color: var(--soft); }
#app > .notice {
  flex: none;
  padding: 0.35rem 0.75rem;
  font-size: 0.7rem;
  text-align: center;
}

/* ---- buttons, inputs ------------------------------------------------------ */

.icon-btn {
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
}
.icon-btn svg { width: 1.3rem; height: 1.3rem; }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.btn {
  display: block;
  width: 100%;
  height: 2.9rem;
  border: 1px solid var(--btn-edge);
  border-radius: 999px;
  background: var(--btn-bg);
  box-shadow: var(--btn-shadow);
  color: var(--on-accent);
  font-weight: 700;
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  backdrop-filter: blur(16px) saturate(150%);
}
/* A small action inside a form (저장, 코드 복사): glass with a tint of the accent. */
.btn.small:not(.quiet) { border-color: var(--btn2-edge); background: var(--btn2-bg); box-shadow: var(--btn2-shadow); color: var(--btn2-ink); }
.btn.quiet {
  border: 1px solid var(--glass-edge);
  background: var(--glass-bg);
  box-shadow: var(--glass-shine), 0 2px 8px rgb(38 72 140 / 0.1);
  color: var(--ink);
  font-weight: 600;
}
.btn.small { width: auto; height: 2.3rem; padding: 0 1rem; font-size: 0.85rem; }
.btn:disabled { opacity: 0.5; cursor: default; }

.form { display: flex; flex-direction: column; gap: 0.9rem; }
.row { display: flex; flex-direction: column; gap: 0.3rem; }
.row > label, .row > .label { font-size: 0.75rem; color: var(--muted); }
.row.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 0.75rem; }
.row.inline > .label { font-size: 0.9rem; color: var(--ink); }
/* A form field. The text room's typing layer is .typing and shares nothing with this. */
.input {
  width: 100%;
  height: 2.75rem;
  padding: 0 0.85rem;
  border: 1px solid var(--line);
  border-radius: 0.9rem;
  background: var(--well);
  box-shadow: inset 0 1px 2px rgb(30 60 120 / 0.08);
  color: var(--ink);
  font-size: 1rem;
}
.input::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.input:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
.with-btn { display: flex; gap: 0.5rem; }
.with-btn .input { flex: 1; min-width: 0; }
.error { min-height: 1.1rem; font-size: 0.8rem; color: var(--danger); }
.help { font-size: 0.75rem; color: var(--muted); }

.seg { display: flex; padding: 0.2rem; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.seg button { flex: 1; height: 2.2rem; border-radius: 999px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--glass-bg); color: var(--ink); box-shadow: var(--glass-shine), 0 1px 3px rgb(20 40 90 / 0.16); }

.switch { position: relative; width: 2.9rem; height: 1.7rem; flex: none; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: color-mix(in srgb, var(--ink) 20%, transparent); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 0.2rem; left: 0.2rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.25); transition: transform 0.15s; }
.switch input:checked + span { background: var(--switch-on); }
.switch input:checked + span::after { transform: translateX(1.2rem); }
.switch input:focus-visible + span { outline: 2px solid var(--ring); outline-offset: 2px; }

.swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.swatch { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
/* A colour of your own: the colour well looks like one more swatch. */
.swatch.own { position: relative; overflow: hidden; background: conic-gradient(#ff5f5f, #ffcf4a, #5fd17a, #4ab8ff, #8a6bff, #ff5fae, #ff5f5f); }
.swatch.own input { position: absolute; inset: -0.5rem; width: 3rem; height: 3rem; border: 0; padding: 0; opacity: 0; cursor: pointer; }

/* ---- bottom sheet --------------------------------------------------------- */

.scrim {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: flex-end;
  background: var(--scrim);
}
.panel {
  width: 100%;
  max-height: 88%;
  padding: 0.7rem 1.25rem 1.5rem;
  overflow-y: auto;
  border: 1px solid var(--glass-edge);
  border-bottom: 0;
  border-radius: 1.8rem 1.8rem 0 0;
  background: var(--panel-bg);
  box-shadow: var(--glass-shine), 0 -14px 40px rgb(20 40 90 / 0.2);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  animation: rise 0.22s ease-out;
}
/* The small grip that says: this sheet slid up, and goes back down. */
.panel::before {
  content: "";
  display: block;
  width: 2.2rem;
  height: 0.28rem;
  margin: 0 auto 0.9rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--ink) 20%, transparent);
}
.panel h2 { margin-bottom: 1rem; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
.panel .section { padding-top: 1.1rem; margin-top: 1.1rem; border-top: 1px solid var(--line); }
.panel .section-title { margin-bottom: 0.7rem; font-size: 0.8rem; font-weight: 700; }
@keyframes rise { from { transform: translateY(1.5rem); opacity: 0; } }

.kinds { display: flex; flex-direction: column; }
.kind {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.85rem 0;
  text-align: left;
  border-top: 1px solid var(--line);
}
.kind:first-child { border-top: 0; }
.kind-name { flex: 1; min-width: 0; font-weight: 700; }
/* Another way in: the same room in the phone's browser. */
.elsewhere { display: flex; gap: 0.5rem; }
.elsewhere > * { flex: 1; }
/* A link that looks like a button: centred like a <button>, no underline. */
a.btn { display: grid; place-items: center; text-decoration: none; }
.kind-icon { display: grid; place-items: center; flex: none; width: 2.2rem; height: 2.2rem; border-radius: 0.8rem; color: var(--accent-ink); background: color-mix(in srgb, var(--tint) 14%, transparent); }
.kind-icon svg { width: 1.25rem; height: 1.25rem; }
.kind-note { display: block; margin-top: 0.1rem; font-size: 0.78rem; font-weight: 400; color: var(--muted); }
.kind:disabled { cursor: default; }
.kind:disabled .kind-name { color: var(--muted); }
.soon { flex: none; font-size: 0.72rem; color: var(--muted); }

.who { display: flex; align-items: center; gap: 0.6rem; width: 100%; padding: 0.7rem 0; border-top: 1px solid var(--line); text-align: left; }
.who:first-child { border-top: 0; }
.who[aria-pressed="true"] .who-name { font-weight: 800; }
.who-name { font-size: 0.95rem; font-weight: 600; }
.dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; flex: none; }

.diag { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.9rem; font-size: 0.78rem; }
.diag dt { color: var(--muted); }
.diag dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.link-box {
  padding: 0.7rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 0.9rem;
  background: var(--well);
  box-shadow: inset 0 1px 2px rgb(30 60 120 / 0.08);
  font-size: 0.82rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
  user-select: all;
  -webkit-user-select: all;
}
.btn-row { display: flex; gap: 0.5rem; }
.btn-row .btn { flex: 1; }
.code { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.06em; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

/* ---- room ----------------------------------------------------------------- */

.room { display: flex; flex-direction: column; height: 100%; }
/* 배경: a grainy gradient or a photo behind the whole room (over the colour field, under its grain);
   the sheets turn to glass over it, so it shows without hiding the words. */
:root {
  --bg-1: linear-gradient(165deg, #ffd6a5 0%, #ff9a8b 55%, #c779d0 100%);
  --bg-2: linear-gradient(165deg, #c2e9fb 0%, #81a4fd 60%, #4b6cb7 100%);
  --bg-3: linear-gradient(165deg, #e0f7c8 0%, #8fd3a6 55%, #3b8d6e 100%);
  --bg-4: linear-gradient(165deg, #f3e7ff 0%, #c8b6ff 55%, #8b7fe8 100%);
  --bg-5: linear-gradient(165deg, #2b3a67 0%, #1b1f3b 60%, #0b0d1a 100%);
  --bg-6: linear-gradient(165deg, #fff1e6 0%, #ffcdb2 55%, #e5989b 100%);
}
.room-bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; pointer-events: none; }
.room-bg[data-bg="1"], .bg-choice[data-bg="1"] { background-image: var(--bg-1); }
.room-bg[data-bg="2"], .bg-choice[data-bg="2"] { background-image: var(--bg-2); }
.room-bg[data-bg="3"], .bg-choice[data-bg="3"] { background-image: var(--bg-3); }
.room-bg[data-bg="4"], .bg-choice[data-bg="4"] { background-image: var(--bg-4); }
.room-bg[data-bg="5"], .bg-choice[data-bg="5"] { background-image: var(--bg-5); }
.room-bg[data-bg="6"], .bg-choice[data-bg="6"] { background-image: var(--bg-6); }
.room.has-bg { --sheet: color-mix(in srgb, var(--paper) 80%, transparent); }
/* Under a background the colour field steps aside (the grain stays, over the photo). */
.room.has-bg::before { display: none; }
.room.has-bg .paper, .room.has-bg .board, .room.has-bg .timeline { -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1); }
.room.has-bg .sheet > .day { width: fit-content; padding: 0.15rem 0.6rem; border-radius: 999px; color: var(--ink); background: var(--glass-bg); }
.bg-choices { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
.bg-choice { display: grid; place-items: center; width: 2.9rem; height: 2.9rem; border-radius: 0.85rem; border: 2px solid var(--glass-edge); background-color: var(--paper); font-size: 0.72rem; font-weight: 700; cursor: pointer; }
.bg-choice[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.bg-choice.photo { display: inline-flex; gap: 0.3rem; width: auto; padding: 0 0.8rem; }
.bg-choice.photo svg { width: 1rem; height: 1rem; }
.bar { display: flex; align-items: center; gap: 0.15rem; padding: 0.6rem 0.4rem 0.4rem; flex: none; }
/* The room's own bar floats as one glass capsule. */
.room > .bar { margin: 0.6rem 0.6rem 0.45rem; padding: 0.15rem 0.2rem; border-radius: 999px; gap: 0.05rem; }
.bar h1 { flex: 1; min-width: 0; font-size: 1rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.people { display: flex; align-items: center; padding: 0 0.3rem; }
.people .dot { margin-left: -0.2rem; box-shadow: 0 0 0 2px var(--glass-edge); }
.status { width: 0.45rem; height: 0.45rem; margin: 0 0.35rem; border-radius: 50%; background: #2fa36b; flex: none; }
.status[data-status="offline"] { background: var(--muted); }
.room-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
/* The text room zooms its own page (two fingers): the browser keeps its hands off, and a zoomed page scrolls sideways too. */
.room-body.text-body { overflow-x: auto; touch-action: pan-x pan-y; }
.banner { flex: none; margin: 0 0.9rem 0.5rem; padding: 0.5rem 0.85rem; border-radius: 0.9rem; font-size: 0.78rem; }

.center {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 0.6rem;
  height: 100%;
  padding: 2rem 1.5rem;
}
.center h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
.center p { color: var(--muted); font-size: 0.9rem; }

.join { height: 100%; padding: 1rem 1.25rem 1.5rem; overflow-y: auto; }
.join .bar { padding: 0 0 0.6rem; margin-left: -0.6rem; }
.join h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; }
.join .lead { margin: 0.2rem 0 1.25rem; font-size: 0.85rem; color: var(--muted); }
.join .form { margin-top: 1.1rem; }
.preview { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }

.toast {
  position: absolute;
  left: 50%;
  bottom: 5.4rem;
  z-index: 20;
  flex: none;
  max-width: 19rem;
  padding: 0.55rem 0.95rem;
  border-radius: 999px;
  font-size: 0.8rem;
  transform: translateX(-50%);
  animation: rise 0.2s ease-out;
  /* A notice never stands in the way of a tap. */
  pointer-events: none;
}
/* Above the drawing tools or the chosen words' row while they are out. */
#app:has(.sel-tools:not([hidden])) .toast, #app:has(.ink-tools:not([hidden])) .toast { bottom: 11.4rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---- text room ------------------------------------------------------------ */

.sheets { display: flex; flex-direction: column; gap: 1.1rem; padding: 0.4rem 0.9rem 1.5rem; min-height: 100%; }
/* Today's sheet is the page itself, down to the bottom of the screen (the owner: "하나의 텍스트
   적을 공간"), and its typing layer covers all of it: a tap low on the empty page writes at the end. */
.sheet.today { flex: 1 0 auto; display: flex; flex-direction: column; }
.sheet.today > .paper { flex: 1 0 auto; display: flex; flex-direction: column; }
.sheet.today > .paper > .layers { flex: 1 0 auto; }
.sheets > .pill { align-self: center; }
.day { margin: 0 0 0.45rem 0.4rem; font-size: 0.72rem; font-weight: 600; color: var(--soft); }
/* The writing sheet: bright and nearly solid, so all eight colours read. The thin
   blue-to-indigo edge is drawn as a ring so the sheet itself can stay see-through. */
.paper {
  position: relative;
  /* (The wide left margin held hour labels until 14 November; the words take the width now.) */
  padding: 1rem 1rem 1.1rem 1.15rem;
  border-radius: 1.5rem;
  background: var(--sheet);
  box-shadow: var(--glass-shine), 0 10px 26px rgb(38 72 140 / 0.12), 0 1px 2px rgb(38 72 140 / 0.08);
}
.paper::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  /* A glass edge, light on top, rather than a coloured ring: the page should not look like a form field. */
  padding: 1px;
  background: linear-gradient(170deg, color-mix(in srgb, var(--frame-a) 70%, transparent), color-mix(in srgb, var(--frame-b) 22%, transparent) 55%, color-mix(in srgb, var(--frame-b) 40%, transparent));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
}
/* The typing layer has its own name: form fields are .input, and the two must never share rules. */
.layers { position: relative; font-size: calc(1rem * var(--text-scale)); font-weight: 600; line-height: 1.75; letter-spacing: 0; }
.draw, .typing { white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; tab-size: 4; }
.draw { min-height: 1.75rem; color: var(--ink); isolation: isolate; }
.sheet.today .draw { min-height: 8.75rem; }
.typing {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  resize: none;
  overflow: hidden;
  background: transparent;
  color: transparent;
  -webkit-text-fill-color: transparent;
  caret-color: transparent;
  font: inherit;
  letter-spacing: inherit;
  touch-action: manipulation;
}
.typing::placeholder { color: var(--muted); -webkit-text-fill-color: var(--muted); opacity: 0.75; }
.typing::selection { background: color-mix(in srgb, var(--frame-a) 45%, transparent); }
.typing:focus-visible { outline: 0; }

/* Words painted with more than one colour: the gradient shows through the letters. */
.w.grad {
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.w.spin { animation: spin 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
@keyframes spin { from { --spin: -360deg; } to { --spin: 0deg; } }

.carets { position: absolute; inset: 0; pointer-events: none; }
.caret { position: absolute; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.caret.mine { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.caret-name {
  position: absolute;
  left: 0;
  bottom: 100%;
  padding: 0.05rem 0.35rem;
  border-radius: 0.4rem 0.4rem 0.4rem 0;
  background: inherit;
  color: var(--paper);
  font-size: 0.62rem;
  font-weight: 700;
  line-height: 1.4;
  white-space: nowrap;
  opacity: 0;
}
.caret.moved .caret-name { animation: name-tag 2s ease-out; }
@keyframes name-tag { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

/* (No hour labels in the margin since 14 November: a long press on a word tells who wrote it and when.) */

/* Undo, redo, colours: one small glass capsule. */
.toolbar {
  display: flex;
  justify-content: center;
  gap: 0.1rem;
  width: fit-content;
  margin: 0.3rem auto 0.75rem;
  padding: 0.2rem 0.35rem;
  border-radius: 999px;
  flex: none;
}
.toolbar .icon-btn[aria-pressed="false"] { color: var(--muted); }
/* Each bottom toolbar button says what it does under its icon (fits 8 buttons on a 320-wide phone). */
.toolbar .icon-btn[data-cap] { display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; width: auto; min-width: min(2.75rem, 11.4vw); height: 3.05rem; padding: 0.3rem 0.15rem 0.28rem; border-radius: 1.1rem; }
.toolbar .icon-btn[data-cap]::after { content: attr(data-cap); font-size: min(0.6rem, 2.7vw); font-weight: 700; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; color: var(--soft); }
.toolbar .icon-btn[data-cap][aria-pressed="true"]::after { color: inherit; }
/* A song card's own ▶ (one tap plays just that card). */
.card-play { display: grid; place-items: center; flex: none; width: 2rem; height: 2rem; margin: -0.35rem 0.05rem -0.35rem -0.3rem; border-radius: 50%; background: color-mix(in srgb, var(--c) 24%, var(--paper)); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); cursor: pointer; }
.card-play svg { width: 0.95rem; height: 0.95rem; }
.card.playing .card-play { background: #e5484d; color: #fff; }

/* ---- song room -------------------------------------------------------------- */
/* The timeline is a bright, nearly solid sheet like the writing paper, so the
   clips' colours read; the controls above and below it float as glass. */

.room-top:empty { display: none; }
.room-top { flex: none; padding: 0 0.7rem 0.4rem; }
.song-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.song-top-left { display: flex; align-items: center; }
.song-top .icon-btn { width: 2.2rem; height: 2.2rem; color: var(--soft); }
.song-top .icon-btn svg { width: 1.15rem; height: 1.15rem; }
.song-clock { display: grid; justify-items: start; min-width: 3.6rem; padding: 0.1rem 0.35rem; text-align: left; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--ink); }
.clock-time { font-size: 0.86rem; font-weight: 800; line-height: 1.15; }
.clock-beat { font-size: 0.6rem; font-weight: 700; line-height: 1.1; color: var(--accent-ink); white-space: nowrap; }
/* 박자: bar and beat lines under the clips and the notes. */
.lanes.beats { background-image: repeating-linear-gradient(to right, color-mix(in srgb, var(--ink) 16%, transparent) 0 1px, transparent 1px var(--bar-px)), repeating-linear-gradient(to right, color-mix(in srgb, var(--ink) 7%, transparent) 0 1px, transparent 1px var(--beat-px)); background-position: var(--grid-x) 0; }
.grid.beats { background-image: repeating-linear-gradient(to right, color-mix(in srgb, var(--ink) 20%, transparent) 0 1px, transparent 1px var(--bar-px)), repeating-linear-gradient(to right, color-mix(in srgb, var(--ink) 9%, transparent) 0 1px, transparent 1px var(--beat-px)); background-position: var(--bar-x) 0, var(--beat-x) 0; }
.tick.bar { border-left-color: color-mix(in srgb, var(--ink) 50%, transparent); }
.bpm-row { display: flex; align-items: center; gap: 0.5rem; }
.bpm-mark { font-size: 1.1rem; font-weight: 800; }
.bpm-input { flex: 1; text-align: center; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.bpm-row .chip { width: 2.6rem; height: 2.6rem; font-size: 1.2rem; }
.mode-switch {
  width: 9.4rem;
  border: 1px solid var(--glass-edge);
  background: var(--glass-bg);
  box-shadow: var(--glass-shine), 0 4px 14px rgb(38 72 140 / 0.12);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
}
.mode-switch button { height: 2rem; color: var(--soft); }
.mode-switch button[aria-pressed="true"] { color: var(--btn2-ink); background: var(--btn2-bg); box-shadow: var(--btn2-shadow); }

.room-body.song-body { position: relative; display: flex; flex-direction: column; overflow: hidden; }
.timeline {
  position: relative;
  flex: 1;
  min-height: 0;
  margin: 0 0.6rem 0.25rem;
  overflow: auto;
  border-radius: 1.3rem;
  background: var(--sheet);
  box-shadow: var(--glass-shine), 0 10px 26px rgb(38 72 140 / 0.12), 0 1px 2px rgb(38 72 140 / 0.08);
  overscroll-behavior: contain;
  touch-action: pan-x pan-y;
  -webkit-overflow-scrolling: touch;
  /* Holding a clip or the time bar must not select their labels: that cancels the touch on phones. */
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  --muted: var(--muted-tone);
}
.song-content { position: relative; min-height: 100%; }
.ruler {
  position: sticky;
  top: 0;
  z-index: 3;
  height: 1.9rem;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  touch-action: none;
  cursor: pointer;
}
.tick { position: absolute; bottom: 0; height: 0.4rem; border-left: 1px solid color-mix(in srgb, var(--ink) 28%, transparent); }
.tick.half { height: 0.25rem; }
.tick.named { height: 100%; padding: 0.3rem 0 0 0.25rem; border-left-color: color-mix(in srgb, var(--ink) 40%, transparent); color: var(--muted); font-size: 0.62rem; font-weight: 700; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.head { position: absolute; bottom: 0; z-index: 1; width: 0.8rem; height: 0.6rem; margin-left: -0.4rem; background: var(--accent); clip-path: polygon(0 0, 100% 0, 50% 100%); pointer-events: none; }
.lanes { position: relative; touch-action: pan-x pan-y; }
.row-bg { position: absolute; left: 0; right: 0; border-bottom: 1px dashed var(--line); }
.row-bg:nth-child(even) { background: color-mix(in srgb, var(--ink) 2.5%, transparent); }
.row-bg.chosen { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.help, .toast, .center p, .song-status { word-break: keep-all; overflow-wrap: anywhere; }
.playline { position: absolute; top: 1.9rem; bottom: 0; z-index: 4; width: 2px; margin-left: -1px; background: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--paper) 55%, transparent); pointer-events: none; }
.song-empty { position: absolute; left: 1.4rem; right: 1.4rem; top: 42%; z-index: 1; color: var(--muted); font-size: 0.86rem; line-height: 1.6; text-align: center; white-space: pre-line; word-break: keep-all; pointer-events: none; }

/* A clip: same height for all, as long as its time. Colour: whoever made it. */
.clip {
  position: absolute;
  overflow: hidden;
  border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent);
  border-radius: 0.75rem;
  background: var(--gloss), color-mix(in srgb, var(--c) 16%, var(--paper));
  box-shadow: var(--gloss-edge), 0 4px 12px color-mix(in srgb, var(--c) 16%, transparent);
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: box-shadow 0.15s, opacity 0.15s;
}
.clip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.clip.selected { border-color: var(--c); box-shadow: 0 0 0 2px var(--ink), 0 6px 16px rgb(30 50 100 / 0.18); }
.clip.peer { box-shadow: 0 0 0 2px var(--peer); }
.clip.selected.peer { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--peer); }
.clip.muted { opacity: 0.45; filter: saturate(0.35); }
.clip.no-notes { border-style: dashed; background: color-mix(in srgb, var(--c) 6%, var(--paper)); }
.clip.lifted { z-index: 6; cursor: grabbing; box-shadow: 0 14px 30px rgb(20 40 90 / 0.3); transition: none; }
.clip.rec { --c: #e5484d; z-index: 2; border-color: #e5484d; background: color-mix(in srgb, #e5484d 14%, var(--paper)); animation: rec-glow 1.4s ease-in-out infinite; }
.wave { position: absolute; inset: 0.2rem 0; pointer-events: none; }
.wave svg { display: block; width: 100%; height: 100%; }
.wave path { fill: color-mix(in srgb, var(--c) 72%, transparent); }
.wave.faint path { fill: color-mix(in srgb, var(--c) 20%, transparent); }
.notes { position: absolute; inset: 0.25rem 0.1rem; pointer-events: none; }
/* A note: higher is higher; its name sits inside when it fits. */
.note {
  position: absolute;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 999px;
  background: var(--c);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.3);
  color: var(--paper);
  font-size: 0.6rem;
  font-style: normal;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.clip-note { position: absolute; top: 50%; left: 0.55rem; right: 0.4rem; overflow: hidden; color: var(--muted); font-size: 0.68rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; transform: translateY(-50%); }
.flags { position: absolute; top: 0.2rem; left: 0.3rem; display: flex; gap: 0.15rem; color: var(--ink); }
.flags svg { width: 0.85rem; height: 0.85rem; }
.rec-time { position: absolute; top: 0.2rem; right: 0.4rem; color: #b3262b; font-size: 0.62rem; font-weight: 800; font-variant-numeric: tabular-nums; }
@keyframes rec-glow { 50% { box-shadow: 0 0 0 3px rgb(229 72 77 / 0.25); } }

.clip-menu {
  position: absolute;
  z-index: 8;
  display: flex;
  gap: 0.05rem;
  padding: 0.2rem;
  border: 1px solid var(--glass-edge);
  border-radius: 999px;
  background: var(--glass-bg);
  box-shadow: var(--glass-shine), var(--glass-shadow);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
}
.clip-menu button { padding: 0.4rem 0.5rem; border-radius: 999px; font-size: 0.74rem; font-weight: 700; white-space: nowrap; }
.clip-menu button:disabled { opacity: 0.35; cursor: default; }
.clip-menu #clip-delete { color: var(--danger); }
.song-status { position: absolute; top: 2.6rem; left: 50%; z-index: 9; padding: 0.45rem 0.95rem; border-radius: 999px; background: color-mix(in srgb, var(--ink) 86%, transparent); color: var(--paper); font-size: 0.78rem; white-space: nowrap; transform: translateX(-50%); }

.song-tools .rec-btn { color: #e5484d; }
.song-tools .rec-btn.on { background: #e5484d; color: #fff; animation: rec-glow 1.4s ease-in-out infinite; }
.song-tools #play[aria-pressed="true"] { color: var(--accent-ink); }
.song-tools #tone[data-tone="dark"] { color: var(--soft); }

.note-list { display: flex; flex-direction: column; margin: 0.8rem 0 0; padding: 0; list-style: none; }
.note-row { display: grid; grid-template-columns: 3.4rem 1fr auto; align-items: center; width: 100%; padding: 0.6rem 0.1rem; border-top: 1px solid var(--line); text-align: left; }
.note-list li:first-child .note-row { border-top: 0; }
.note-name { font-weight: 800; }
.note-at { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.note-len { font-size: 0.88rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.range { width: 100%; accent-color: var(--accent); }

/* ---- drawing ------------------------------------------------------------------ */
/* The pen's canvas lies over the sheet. Off, touches go through to the text. */
/* Drawing reaches past the paper's sides to the screen's edges; the paper grows downwards to hold drawings. */
/* A canvas is a replaced element: left and right do not stretch it, so its size is set outright
   (without it, its own pixel size becomes its size and it doubles on every redraw). */
.paper canvas.ink { position: absolute; top: 0; left: -0.9rem; width: calc(100% + 1.8rem); height: 100%; z-index: 0; pointer-events: none; }
/* Drawings lie beneath the words (they never hide them); while the pen is on, the words let
   the pen through to the drawing layer. */
.paper { isolation: isolate; }
.paper > .layers { position: relative; z-index: 1; }
.paper.inking > .layers { pointer-events: none; }
.paper canvas.ink.on { pointer-events: auto; touch-action: none; cursor: crosshair; }
.paper canvas.ink[data-tool="eraser"] { cursor: cell; }
.ink-tools, .sel-tools {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
  width: fit-content;
  max-width: calc(100% - 1rem);
  margin: 0 auto 0.4rem;
  padding: 0.3rem 0.5rem;
  border: 1px solid var(--glass-edge);
  border-radius: 1.2rem;
  background: var(--glass-bg);
  box-shadow: var(--glass-shine), var(--glass-shadow);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  flex: none;
}
.ink-color { width: 1.3rem; height: 1.3rem; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); }
.ink-color[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.ink-width { display: grid; place-items: center; width: 1.55rem; height: 1.55rem; border-radius: 50%; }
.ink-width span { display: block; border-radius: 50%; background: var(--ink); }
.ink-width[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.ink-tools .icon-btn { width: 1.9rem; height: 1.9rem; }
.ink-tools .icon-btn svg { width: 1.1rem; height: 1.1rem; }
.ink-tools .icon-btn[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 12%, transparent); }

/* ---- song room: ways in, speed, friends, note editor ---------------------------- */

/* A file input the eye does not see, opened by its <label>. */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
label.btn { display: grid; place-items: center; cursor: pointer; text-align: center; -webkit-user-select: none; user-select: none; }
.btn.rec-way { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
.dot-rec { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: #ff5a5f; box-shadow: 0 0 0 2px rgb(255 255 255 / 0.6); }
.help.warn { padding: 0.6rem 0.75rem; border-radius: 0.8rem; background: color-mix(in srgb, #e5484d 12%, transparent); color: var(--ink); }
.song-start {
  position: absolute;
  left: 1.1rem;
  right: 1.1rem;
  top: 50%;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  max-width: 24rem;
  margin: 0 auto;
  padding: 1rem;
  border: 1px solid var(--glass-edge);
  border-radius: 1.4rem;
  background: var(--panel-bg);
  box-shadow: var(--glass-shine), var(--glass-shadow);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  transform: translateY(-45%);
  --muted: var(--muted-tone);
}
.song-start .start-title { font-size: 1.05rem; font-weight: 800; }
.song-start .btn { height: 2.6rem; font-size: 0.9rem; }
.song-start .help { font-size: 0.7rem; }
.speed-btn { width: auto; min-width: 2.5rem; padding: 0 0.35rem; font-size: 0.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.song-tools { gap: 0; padding: 0.2rem 0.25rem; }
.song-tools .icon-btn { width: 2.4rem; }
.song-tools .rec-btn.no-mic { opacity: 0.75; }
.clip.other-rec { z-index: 2; border: 2px dashed var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); animation: rec-glow 1.4s ease-in-out infinite; }
.rec-name { position: absolute; top: 0.25rem; left: 0.4rem; font-size: 0.66rem; font-weight: 800; color: var(--ink); white-space: nowrap; }
.clip-menu { flex-wrap: wrap; justify-content: center; max-width: calc(100% - 0.75rem); border-radius: 1.2rem; }

/* 음 편집: a piano roll. Keys on the left name the notes; bars are the notes. */
.panel.editor-panel { max-height: 94%; }
.roll-tools { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.6rem 0; align-items: center; }
.chip { height: 2rem; padding: 0 0.7rem; border-radius: 999px; border: 1px solid var(--line); background: var(--well); font-size: 0.78rem; font-weight: 700; }
.roll-tools .btn.small { height: 2rem; margin-left: auto; }
.roll {
  position: relative;
  display: flex;
  height: min(48vh, 22rem);
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 1rem;
  background: var(--sheet);
  overscroll-behavior: contain;
  touch-action: pan-x pan-y;
  /* A long press picks a note up; selecting its name instead would cancel the touch on phones. */
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.keys { position: sticky; left: 0; z-index: 3; flex: none; width: 2.6rem; background: var(--paper); box-shadow: 1px 0 0 var(--line); }
.key { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 0.3rem; font-size: 0.6rem; color: var(--muted); border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.key.black { background: color-mix(in srgb, var(--ink) 9%, var(--paper)); }
.key.c { color: var(--ink); font-weight: 800; }
.grid { position: relative; flex: none; }
.lane-row { position: absolute; left: 0; right: 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.lane-row.black { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.rnote {
  position: absolute;
  z-index: 1;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 0.4rem;
  color: var(--paper);
  font-size: 0.62rem;
  font-style: normal;
  font-weight: 800;
  white-space: nowrap;
  cursor: grab;
  touch-action: none;
  box-shadow: inset -5px 0 0 rgb(255 255 255 / 0.35);
}
.rnote.chosen { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 2; }
.roll-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.note-row.chosen .note-name { color: var(--accent-ink); }

/* ---- lying down (가로) and computers ------------------------------------------ */
/* The app takes the width; the song timeline gets all of it. The writing sheet
   keeps its 360 column, so text wraps and drawings sit exactly as upright. */
html[data-orient="landscape"] #app { width: min(100%, 75rem); }
html[data-orient="landscape"] .sheets { max-width: 22.5rem; width: 100%; margin-inline: auto; }
html[data-orient="landscape"] .scrim { justify-content: center; }
html[data-orient="landscape"] .panel { width: min(100%, 32rem); border-radius: 1.8rem 1.8rem 0 0; }
html[data-orient="landscape"] .panel.editor-panel { width: min(100%, 52rem); }
html[data-orient="landscape"] .join, html[data-orient="landscape"] .center { width: min(100%, 30rem); margin-inline: auto; }
html[data-orient="landscape"] .song-start { max-width: 26rem; }
.ink-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.18rem; }
.ink-brush { height: 1.9rem; padding: 0 0.55rem; border-radius: 999px; font-size: 0.74rem; font-weight: 700; color: var(--muted); }
.ink-brush[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
.seg.ink-erase { padding: 0.12rem; }
.seg.ink-erase button { height: 1.7rem; padding: 0 0.6rem; font-size: 0.72rem; }

/* ---- whiteboard ---------------------------------------------------------------- */
/* The whiteboard runs under the bars to every edge of the screen (the owner: "엄청 크게…
   무한적으로"); the bars float over it as glass. The room body stays the part in view. */
.room-body.board-body { position: relative; overflow: visible; }
.room[data-kind="creative-board"] > :is(.bar, .banner, .room-top, .toolbar, .ink-tools) { position: relative; z-index: 2; }
/* 그리기 on the whiteboard: a screen-sized canvas beneath the cards, drawn in the board's own frame;
   while the pen is on, the cards let every touch through to it. */
.board > canvas.ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.board > canvas.ink.on { pointer-events: auto; touch-action: none; cursor: crosshair; }
.board > canvas.ink[data-tool^="eraser"] { cursor: cell; }
.board.inking .board-content, .board.inking .board-content * { pointer-events: none !important; }
.board { position: absolute; inset: calc(-1 * var(--top-inset, 0px)) 0 calc(-1 * var(--bottom-inset, 0px)); overflow: hidden; background: var(--sheet); touch-action: none; cursor: grab;
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 1px); background-size: 22px 22px; }
.board-content { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.board-lines { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.board-lines path { fill: none; stroke-width: 3.5; stroke-linecap: round; }
.board-lines .badge { pointer-events: auto; cursor: pointer; }
.board-lines .badge text { fill: #fff; font: 800 13px var(--font); }
/* 올가미: a dashed loop under the cards; its chip stays the same size at any zoom. */
.board-loops { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.board-loops path { fill: color-mix(in srgb, var(--lc, var(--accent)) 10%, transparent); stroke: var(--lc, var(--accent)); stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.board-loops path.drawing { fill: color-mix(in srgb, var(--accent) 6%, transparent); stroke-dasharray: none; }
.board.lassoing, .board.lassoing .card { cursor: crosshair; }
/* 잇기 by a line: the line as it is drawn, and the cards it has passed, numbered. */
.board-loops path.chain-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; }
.card[data-chain]::after { content: attr(data-chain); position: absolute; top: -0.6rem; right: -0.6rem; display: grid; place-items: center; min-width: 1.5rem; height: 1.5rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 0.75rem; font-weight: 800; box-shadow: 0 2px 8px rgb(30 50 100 / 0.25); }
.card[data-chain] { box-shadow: 0 0 0 3px var(--accent), 0 6px 18px rgb(30 50 100 / 0.2); }
/* A picture card. */
.card.photo { padding: 0.3rem; background: var(--gloss), var(--paper); }
.card-photo { display: block; width: 100%; height: auto; border-radius: 0.75rem; pointer-events: none; -webkit-user-drag: none; }
.lasso-chip { position: absolute; z-index: 3; display: flex; gap: 0.2rem; padding: 0.2rem; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; background: var(--gloss), var(--card-bg), var(--paper); box-shadow: var(--gloss-edge), 0 6px 16px rgb(30 50 100 / 0.18); transform-origin: 0 0; transform: scale(var(--unzoom, 1)); touch-action: none; cursor: grab; white-space: nowrap; }
.lasso-chip button { min-width: 2.75rem; min-height: 2.5rem; padding: 0 0.7rem; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font: 800 0.85rem var(--font); cursor: pointer; }
.lasso-chip .lasso-play { background: var(--accent); color: var(--on-accent, #fff); }
.lasso-chip.side { flex-direction: column; }
.lasso-chip.side button { padding: 0 0.45rem; }
.card { position: absolute; padding: 0.55rem 0.65rem; border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: 1rem; background: var(--gloss), color-mix(in srgb, var(--c) 12%, var(--paper)); box-shadow: var(--gloss-edge), 0 6px 18px color-mix(in srgb, var(--c) 18%, transparent); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
/* Text on the board is plain text (no box), in its own colour and size. */
.card.memo { padding: 0.15rem 0.3rem; border-color: transparent; background: none; box-shadow: none; }
.card.memo .card-text { color: var(--tc, var(--ink)); font-size: 1rem; font-weight: 600; line-height: 1.45; }
.card.memo[data-size="1"] .card-text { font-size: 0.82rem; }
.card.memo[data-size="3"] .card-text { font-size: 1.4rem; font-weight: 700; line-height: 1.3; }
.card.memo.chosen { box-shadow: none; outline: 2px dashed color-mix(in srgb, var(--ink) 40%, transparent); outline-offset: 2px; }
.menu-dot { width: 1.35rem; height: 1.35rem; margin: 0 0.05rem; padding: 0; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); }
.menu-dot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.menu-swatch { display: inline-block; width: 0.8rem; height: 0.8rem; margin-right: 0.25rem; border-radius: 50%; vertical-align: -0.05rem; box-shadow: 0 0 0 1px var(--line); }
.lasso-chip .lasso-more { min-width: 2.2rem; padding: 0 0.4rem; font-size: 1.1rem; }
.card.chosen { box-shadow: var(--gloss-edge), 0 0 0 2px var(--ink), 0 6px 18px rgb(30 50 100 / 0.2); }
.card.link-from { box-shadow: 0 0 0 3px var(--accent), 0 6px 18px rgb(30 50 100 / 0.2); }
.card.playing { box-shadow: var(--gloss-edge), 0 0 0 3px #e5484d, 0 0 22px rgb(229 72 77 / 0.35); }
.card-text { white-space: pre-wrap; font-size: 0.85rem; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
.card-head { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 800; }
.card-order { display: grid; place-items: center; min-width: 1.3rem; height: 1.3rem; padding: 0 0.25rem; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 0.66rem; }
.card-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-len { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.card-notes { position: relative; height: 3.4rem; margin-top: 0.35rem; border-radius: 0.5rem; background: color-mix(in srgb, var(--c) 8%, transparent); }
.board-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.board-modes { width: 100%; max-width: 27rem; }
.board-modes button { padding: 0 0.1rem; letter-spacing: -0.02em; }
/* Words written in place on the board: over their own words, in their size and colour. */
.board-typing { position: absolute; z-index: 3; margin: 0; padding: 0; border: 0; outline: none; resize: none; overflow: hidden; background: transparent; font-family: inherit; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; caret-color: var(--accent); }
.card.memo.writing .card-text { visibility: hidden; }
.card.memo.writing { outline: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 4px; }
.write-colors { flex-wrap: nowrap; }
/* The mode's own tools: small glass icons standing at the board's right edge. */
/* A grid that fills downwards and, on a short screen (landscape), opens another column to the left. No scrolling. */
.board-rail { position: absolute; top: 0.5rem; right: 1rem; bottom: 0.6rem; z-index: 3; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 2.9rem); gap: 0.35rem; align-content: start; direction: rtl; pointer-events: none; }
.board-rail > * { direction: ltr; pointer-events: auto; }
.rail-btn { display: grid; place-items: center; align-content: center; gap: 0.05rem; width: 2.9rem; height: 2.9rem; border: 1px solid var(--glass-edge); border-radius: 0.95rem; background: var(--glass-bg); box-shadow: var(--glass-shine), var(--glass-shadow); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--ink); }
.rail-btn svg { width: 1.15rem; height: 1.15rem; }
.rail-text { font-size: 0.82rem; font-weight: 800; line-height: 1; }
.rail-cap { font-size: 0.52rem; font-weight: 700; line-height: 1; color: var(--muted); white-space: nowrap; }
.rail-btn[aria-pressed="true"] { background: var(--switch-on); color: var(--on-accent); }
.rail-btn[aria-pressed="true"] .rail-cap { color: inherit; }
.rail-btn:disabled { opacity: 0.4; }
.board-status { position: absolute; left: 50%; top: 0.9rem; z-index: 4; transform: translateX(-50%); padding: 0.35rem 0.9rem; border-radius: 999px; background: color-mix(in srgb, var(--ink) 82%, transparent); color: var(--paper); font-size: 0.75rem; white-space: nowrap; }
.card.muted { opacity: 0.55; }
/* What sounds: a glow, and on the board a line running through the notes. */
.clip.playing { box-shadow: 0 0 0 2px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); }
.card-line { position: absolute; top: -0.25rem; bottom: -0.25rem; z-index: 1; width: 2px; margin-left: -1px; border-radius: 1px; background: #e5484d; box-shadow: 0 0 6px rgb(229 72 77 / 0.6); pointer-events: none; }
.card-muted svg { width: 0.9rem; height: 0.9rem; }
.card.cut-ready { cursor: crosshair; box-shadow: 0 0 0 2px var(--accent), 0 6px 18px rgb(30 50 100 / 0.2); }
.card-notes .note, .pick-notes .note { overflow: hidden; white-space: nowrap; }
/* 순서 칸: drops down beside its button. */
.slot-menu { position: absolute; right: 4.3rem; z-index: 5; width: min(17rem, calc(100% - 5rem)); padding: 0.6rem; border: 1px solid var(--glass-edge); border-radius: 1.1rem; background: var(--paper); box-shadow: var(--glass-shadow); }
.slot-title { margin: 0 0 0.35rem; font-size: 0.8rem; font-weight: 800; }
.slot-row { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.2rem; border-top: 1px solid var(--line); }
.slot-row.current .slot-n { background: var(--accent); color: var(--on-accent); }
.slot-n { display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); font-size: 0.75rem; font-weight: 800; }
.slot-what { flex: 1; font-size: 0.75rem; color: var(--muted); }
.slot-row .chip, .slot-more { height: 1.8rem; padding: 0 0.6rem; font-size: 0.72rem; }
.slot-more { margin-top: 0.35rem; }
/* 내 노래: a panel from the right. */
.drawer-scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; display: flex; flex-direction: column; width: min(21rem, 86vw); padding: max(0.8rem, env(safe-area-inset-top)) 0.8rem 0.8rem; background: var(--paper); box-shadow: -12px 0 32px rgb(0 0 0 / 0.22); animation: drawer-in 0.22s ease-out; }
@keyframes drawer-in { from { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; }
.drawer-head .icon-btn svg { transform: scaleX(-1); }
.drawer-title { margin: 0; font-size: 1.15rem; font-weight: 800; }
.drawer-note { margin: 0.2rem 0 0.4rem; }
.drawer-list { flex: 1; overflow-y: auto; }
.drawer-section { padding: 0.5rem 0; border-top: 1px solid var(--line); }
.drawer-room, .drawer-group { margin: 0 0 0.35rem; font-size: 0.78rem; font-weight: 800; color: var(--muted); }
.drawer-picks { display: grid; gap: 0.45rem; }
.song-pick { display: block; width: 100%; padding: 0.5rem 0.6rem; text-align: left; border: 1.5px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 0.9rem; background: color-mix(in srgb, var(--accent) 7%, var(--paper)); }
.pick-head { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; font-weight: 800; }
